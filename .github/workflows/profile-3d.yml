name: Refresh observatory telemetry

on:
  schedule:
    - cron: "17 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main, claude/dreamy-galileo-zw5qis]
    paths: [".github/workflows/profile-3d.yml", "scripts/**"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comet trail (contribution snake)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/comet-trail.svg?palette=github-dark&color_snake=#e0f2fe&color_dots=#111633,#3b2a8c,#7c3aed,#c026d3,#38bdf8&color_background=#050816

      - name: Telemetry, skyline, light curve and project cards
        run: python3 scripts/build_dynamic.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          git diff --cached --quiet || git commit -m "chore: refresh observatory telemetry"
          git push
